services:
  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=entcv
      - POSTGRES_USER=${POSTGRES_USER:-entcv}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-entcv} -d entcv"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../
      dockerfile: web/backend/Dockerfile
    ports:
      - "8787:8787"
    volumes:
      - /mnt/data/ent_cv/predictions:/mnt/data/ent_cv/predictions:ro
      - /mnt/data/ent_cv/raw:/mnt/data/ent_cv/raw:ro
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,entcv.jaehho.com
      - CSRF_TRUSTED_ORIGINS=https://entcv.jaehho.com
      - DATABASE_URL=postgres://${POSTGRES_USER:-entcv}:${POSTGRES_PASSWORD}@db:5432/entcv
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "8050:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
