[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ent_cv"
version = "0.0.1"
description = "Computer vision in ent surgery"
authors = [
  { name = "Jaeho Cho" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "cvat-cli>=2.51.0",
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "python-dotenv",
    "requests-toolbelt>=1.0.0",
    "ruff",
    "scikit-learn",
    "tqdm",
    "typer",
    "ultralytics>=8.3.235",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["ent_cv"]
include = ["pyproject.toml", "ent_cv/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["ent_cv"]
force-sort-within-sections = true

