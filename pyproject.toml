[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ent_cv"
version = "0.0.1"
description = "Computer vision in ENT surgery"
authors = [
  { name = "Jaeho Cho" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "cvat-cli",
    "cvat-sdk",
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "notebook",
    "numpy",
    "onnx",
    "onnxruntime-gpu",
    "onnxslim",
    "opencv-python",
    "pandas",
    "pip",
    "polars",
    "python-dotenv",
    "requests-toolbelt",
    "ruff",
    "scikit-learn",
    "tensorflow",
    "tensorrt",
    "torch",
    "tqdm",
    "typer",
    "ultralytics",
    "wheel",
]
requires-python = "~=3.12.0"

[project.scripts]
ent-cv = "ent_cv.modeling.cli:app"


[tool.ruff]
line-length = 99
src = ["ent_cv"]
include = ["pyproject.toml", "ent_cv/**/*.py"]

[tool.pyright]
# Suppress diagnostics caused by incomplete third-party stubs (e.g. ultralytics)
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["ent_cv"]
force-sort-within-sections = true

