name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["*.md", "reports/**", "runner/**"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Write .env for Docker Compose
        run: |
          cat > web/.env <<EOF
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          POSTGRES_USER=entcv
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          EOF

      - name: Deploy
        working-directory: web
        run: |
          docker compose --env-file .env down
          docker compose --env-file .env up -d --build --wait

      - name: Wait for database readiness
        working-directory: web
        run: |
          for i in {1..30}; do
            if docker compose --env-file .env exec -T db pg_isready -U entcv -d entcv; then
              exit 0
            fi
            sleep 5
          done
          echo "Database readiness check failed"
          docker compose --env-file .env logs --tail=100 db
          exit 1

      - name: Run database migrations
        working-directory: web
        run: |
          docker compose --env-file .env exec -T backend python manage.py migrate --noinput

      - name: Health check
        working-directory: web
        run: |
          for i in {1..30}; do
            if curl -fsS -o /dev/null http://localhost:8050/; then
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"
          docker compose --env-file .env logs --tail=100
          exit 1

      - name: Tag deployment
        run: |
          git tag "deploy-$(date +%Y%m%d-%H%M%S)" || true
          git push --tags || true

      - name: Cleanup old images
        if: success()
        run: docker image prune -f

      - name: Cleanup .env
        if: always()
        run: rm -f web/.env
